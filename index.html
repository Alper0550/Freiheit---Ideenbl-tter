<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freiheit — Ideenblatt</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0b0d12;
      --surface:      #111318;
      --surface2:     #181b23;
      --surface3:     #1f2330;
      --border:       rgba(255,255,255,0.06);
      --border2:      rgba(255,255,255,0.11);
      --gold:         #c9a84c;
      --gold-light:   #e4c97a;
      --gold-dim:     rgba(201,168,76,0.12);
      --text:         #eceae0;
      --text2:        #878480;
      --text3:        #454240;
      --green:        #3d7a5e;
      --green-light:  #5aaa7e;
      --green-dim:    rgba(61,122,94,0.16);
      --red:          #a83c3c;
      --red-dim:      rgba(168,60,60,0.16);
      --radius:       14px;
      --radius-sm:    9px;
      --radius-xs:    6px;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 5rem;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      padding: 2.5rem 2.5rem 0;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 100% at 5% 50%, rgba(201,168,76,0.055) 0%, transparent 65%),
        radial-gradient(ellipse 35% 70% at 95% 10%, rgba(61,122,94,0.045) 0%, transparent 65%);
      pointer-events: none;
    }

    .hero-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1.1rem;
    }

    .logo-img {
      width: 58px; height: 58px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      object-fit: cover;
      box-shadow: 0 0 22px rgba(201,168,76,0.18);
      flex-shrink: 0;
    }

    .brand-text { line-height: 1; }

    .brand-eyebrow {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 5px;
      display: block;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text3);
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-top: 5px;
      display: block;
    }

    /* ── META BAR ── */
    .meta-bar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.2rem 0 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .meta-label {
      font-size: 10px;
      color: var(--text3);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-right: 2px;
    }

    .meta-input {
      font-family: 'Outfit', sans-serif;
      font-size: 12.5px;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-xs);
      padding: 6px 11px;
      outline: none;
      transition: border-color 0.2s;
    }
    .meta-input:focus { border-color: rgba(201,168,76,0.5); }
    .meta-input::placeholder { color: var(--text3); }

    /* ── TOOLBAR ── */
    .toolbar {
      max-width: 1120px;
      margin: 2rem auto 1.5rem;
      padding: 0 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .toolbar-label {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text3);
    }

    .toolbar-right { display: flex; gap: 8px; }

    .btn {
      font-family: 'Outfit', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: var(--radius-xs);
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text2);
      transition: all 0.18s;
      letter-spacing: 0.02em;
    }
    .btn:hover { background: var(--surface3); color: var(--text); }

    .btn-gold {
      background: var(--gold);
      color: #0b0d12;
      border-color: var(--gold);
      font-weight: 600;
    }
    .btn-gold:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
      color: #0b0d12;
      box-shadow: 0 0 18px rgba(201,168,76,0.22);
    }

    /* ── GRID ── */
    .grid {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 2.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
      gap: 1.4rem;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      animation: fadeUp 0.28s ease;
      transition: border-color 0.2s;
    }
    .card:focus-within { border-color: rgba(201,168,76,0.22); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-accent {
      height: 2px;
      background: linear-gradient(90deg, var(--gold) 0%, transparent 80%);
      opacity: 0.6;
    }

    /* Card header */
    .card-head {
      padding: 1rem 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .card-head-left { display: flex; align-items: center; gap: 8px; }

    .card-num {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-dim);
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(201,168,76,0.18);
    }

    .card-person-name {
      font-size: 11.5px;
      color: var(--text2);
      font-weight: 400;
    }

    .btn-del {
      background: none; border: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: var(--text3);
      cursor: pointer; transition: all 0.15s;
    }
    .btn-del:hover { background: var(--red-dim); color: #d06060; }

    /* Card body */
    .card-body { padding: 1.2rem 1.3rem; }

    /* Section title */
    .sec {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 1.2rem 0 0.8rem;
    }
    .sec:first-child { margin-top: 0; }
    .sec::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Fields */
    .field { margin-bottom: 0.8rem; }
    .field:last-child { margin-bottom: 0; }

    .flabel {
      display: block;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 4px;
    }

    .finput, .ftextarea {
      width: 100%;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      padding: 8px 10px;
      outline: none;
      line-height: 1.5;
      transition: border-color 0.18s, background 0.18s;
    }
    .finput:focus, .ftextarea:focus {
      border-color: rgba(201,168,76,0.35);
      background: var(--surface3);
    }
    .finput::placeholder, .ftextarea::placeholder { color: var(--text3); }
    .ftextarea { resize: vertical; min-height: 68px; }
    .ftextarea.sm { min-height: 52px; }

    .finput.title-f {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Two col */
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* Euro prefix */
    .eur-wrap { position: relative; }
    .eur-sym {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      font-size: 12px; color: var(--gold); font-weight: 600; pointer-events: none;
    }
    .eur-wrap .finput { padding-left: 23px; }

    /* Yes / No toggle */
    .yn { display: flex; gap: 6px; margin-top: 4px; }
    .yn-btn {
      font-size: 11.5px; font-weight: 500;
      padding: 5px 14px; border-radius: 999px;
      cursor: pointer; user-select: none;
      border: 1px solid var(--border2);
      color: var(--text3); background: var(--surface2);
      transition: all 0.15s;
    }
    .yn-btn:hover { color: var(--text); }
    .yn-btn.ja  { background: var(--green-dim); border-color: var(--green); color: var(--green-light); }
    .yn-btn.nein { background: var(--red-dim);  border-color: var(--red);   color: #d06060; }

    /* Chip tags */
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .chip {
      font-size: 11px; font-weight: 500;
      padding: 4px 11px; border-radius: 999px;
      cursor: pointer; user-select: none;
      border: 1px solid var(--border2);
      color: var(--text3); background: var(--surface2);
      transition: all 0.14s;
    }
    .chip:hover { border-color: var(--gold); color: var(--gold); }
    .chip.on { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

    /* Priority dots */
    .prio-row { display: flex; gap: 5px; margin-top: 4px; }
    .pdot {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; color: var(--text3);
      cursor: pointer; user-select: none; transition: all 0.15s;
    }
    .pdot:hover { border-color: var(--text2); color: var(--text); }
    .pdot[data-p="1"].on { background: var(--green-dim); border-color: var(--green); color: var(--green-light); }
    .pdot[data-p="2"].on { background: rgba(60,110,200,0.15); border-color: #4070c0; color: #7aaae0; }
    .pdot[data-p="3"].on { background: rgba(190,160,40,0.15); border-color: #b4a020; color: #ddc830; }
    .pdot[data-p="4"].on { background: rgba(200,120,40,0.15); border-color: #c07020; color: #e09840; }
    .pdot[data-p="5"].on { background: var(--red-dim); border-color: var(--red); color: #d06060; }
    .prio-legend { display: flex; justify-content: space-between; margin-top: 3px; }
    .prio-legend span { font-size: 8.5px; color: var(--text3); }

    /* Confidence meter */
    .conf-wrap { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .conf-wrap input[type=range] {
      flex: 1; -webkit-appearance: none;
      height: 3px; border-radius: 3px;
      background: var(--surface3); outline: none; border: none;
    }
    .conf-wrap input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--gold); cursor: pointer;
      box-shadow: 0 0 6px rgba(201,168,76,0.4);
    }
    .conf-val {
      font-size: 12px; font-weight: 600; color: var(--gold); min-width: 24px; text-align: right;
    }

    /* MVP section */
    .mvp-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1rem;
    }

    /* Empty */
    .empty {
      max-width: 1120px; margin: 2.5rem auto; padding: 0 2.5rem;
    }
    .empty-inner {
      border: 1px dashed var(--border2);
      border-radius: var(--radius);
      padding: 3.5rem 2rem;
      text-align: center; color: var(--text3); font-size: 13.5px;
    }

    /* ── PRINT ── */
    @media print {
      body { background: #fff; color: #111; padding: 0; }
      .hero { background: #fff; }
      .hero::before, .hero-grid { display: none; }
      .brand-name { color: #111; }
      .brand-eyebrow, .sec { color: #888; }
      .toolbar-right, .btn-del { display: none !important; }
      .card { background: #fff; border: 1px solid #ccc; break-inside: avoid; }
      .card-head { background: #f5f5f5; border-bottom-color: #ddd; }
      .card-accent { background: #c9a84c; }
      .finput, .ftextarea { background: #fafafa; border-color: #ddd; color: #111; }
      .chip.on { background: #eee; color: #333; border-color: #999; }
      .yn-btn.ja { background: #e8f5ee; color: #2d6640; border-color: #2d6640; }
      .yn-btn.nein { background: #fceaea; color: #8a2020; border-color: #8a2020; }
      .pdot.on { border-width: 2px; }
      .meta-input { background: #f5f5f5; border-color: #ddd; color: #111; }
      .grid { grid-template-columns: 1fr 1fr; }
      .hero-inner { border-bottom-color: #ddd; }
      .card-num { background: #eee; color: #666; border-color: #ccc; }
      .mvp-box { background: #f8f8f8; border-color: #ddd; }
    }

    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; padding: 0 1rem; }
      .hero { padding: 1.5rem 1rem 0; }
      .toolbar { padding: 0 1rem; }
      .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <span class="toolbar-label">Ideenblätter</span>
  <div class="toolbar-right">
    <button class="btn" onclick="window.print()">Drucken / PDF</button>
    <button class="btn btn-gold" onclick="addCard()">+ Idee hinzufügen</button>
  </div>
</div>

<!-- CARDS -->
<div class="grid" id="grid"></div>

<script>
  let count = 0;

  const CHARS = ['Schnell umsetzbar','Langfristig','Skalierbar','Günstig','Kapitalintensiv','Innovativ','Geringes Risiko','Hohe Wirkung','B2C','B2B','Digital','Physisch'];

  function addCard() {
    count++;
    const n = count;
    const grid = document.getElementById('grid');
    const empty = grid.querySelector('.empty');
    if (empty) empty.remove();

    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + n;

    card.innerHTML = `
      <div class="card-accent"></div>
      <div class="card-head">
        <div class="card-head-left">
          <span class="card-num">Idee #${n}</span>
          <span class="card-person-name" id="badge-${n}"></span>
        </div>
        <button class="btn-del" onclick="removeCard(${n})">✕</button>
      </div>

      <div class="card-body">

        <!-- 1. GRUNDINFO -->
        <div class="sec">Grundinfo</div>

        <div class="field">
          <label class="flabel">Person</label>
          <input class="finput" type="text" placeholder="Wer präsentiert diese Idee?" oninput="setBadge(${n}, this.value)" />
        </div>

        <div class="field">
          <label class="flabel">Titel der Idee</label>
          <input class="finput title-f" type="text" placeholder="Name der Idee" />
        </div>

        <div class="field">
          <label class="flabel">Kategorie</label>
          <input class="finput" type="text" placeholder="z.B. E-Commerce, Dienstleistung, Produkt, App …" />
        </div>

        <!-- 2. PROBLEM & LÖSUNG (Lean Canvas) -->
        <div class="sec">Problem &amp; Lösung</div>

        <div class="field">
          <label class="flabel">Problem — Was lösen wir?</label>
          <textarea class="ftextarea" placeholder="Welches konkrete Problem hat die Zielgruppe heute? Wie lösen sie es aktuell?"></textarea>
        </div>

        <div class="field">
          <label class="flabel">Zielgruppe / Kundensegment</label>
          <input class="finput" type="text" placeholder="Wer leidet am meisten unter diesem Problem?" />
        </div>

        <div class="field">
          <label class="flabel">Unsere Lösung</label>
          <textarea class="ftextarea" placeholder="Was genau bieten wir an? Wie funktioniert es?"></textarea>
        </div>

        <div class="field">
          <label class="flabel">Einzigartiger Mehrwert (Unique Value Proposition)</label>
          <textarea class="ftextarea sm" placeholder="Warum sollen Kunden uns wählen — und nicht die Konkurrenz?"></textarea>
        </div>

        <div class="field">
          <label class="flabel">Unser Vorteil (Unfair Advantage)</label>
          <textarea class="ftextarea sm" placeholder="Was haben wir, das Wettbewerber nicht einfach kopieren können? (Netzwerk, Wissen, Zugang, Erfahrung …)"></textarea>
        </div>

        <!-- 3. MARKT & VERTRIEB -->
        <div class="sec">Markt &amp; Vertrieb</div>

        <div class="field">
          <label class="flabel">Vertriebskanäle — Wie erreichen wir Kunden?</label>
          <input class="finput" type="text" placeholder="z.B. Social Media, Empfehlungen, Online-Shop, Messen …" />
        </div>

        <div class="field">
          <label class="flabel">Konkurrenz / bestehende Alternativen</label>
          <input class="finput" type="text" placeholder="Wer löst das Problem heute schon — direkt oder indirekt?" />
        </div>

        <!-- 4. FINANZEN -->
        <div class="sec">Finanzen</div>

        <div class="row2">
          <div class="field">
            <label class="flabel">Startkapital (ca.)</label>
            <div class="eur-wrap">
              <span class="eur-sym">€</span>
              <input class="finput" type="text" placeholder="z.B. 10.000" />
            </div>
          </div>
          <div class="field">
            <label class="flabel">Laufende Kosten / Monat</label>
            <div class="eur-wrap">
              <span class="eur-sym">€</span>
              <input class="finput" type="text" placeholder="z.B. 800" />
            </div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">Einnahmequellen — Wie verdienen wir Geld?</label>
          <input class="finput" type="text" placeholder="z.B. Produktverkauf, Abo, Provision, Dienstleistung …" />
        </div>

        <div class="field">
          <label class="flabel">Break-Even (ca.) — Ab wann läuft es kostendeckend?</label>
          <input class="finput" type="text" placeholder="z.B. nach 6 Monaten / ab 50 Kunden / ab 5.000 € Umsatz" />
        </div>

        <!-- 5. RESSOURCEN & INFRASTRUKTUR -->
        <div class="sec">Ressourcen &amp; Infrastruktur</div>

        <div class="field">
          <label class="flabel">Zu dritt umsetzbar?</label>
          <div class="yn" id="yn-team-${n}">
            <span class="yn-btn" onclick="toggleYN(this,'${n}','team','ja')">Ja</span>
            <span class="yn-btn" onclick="toggleYN(this,'${n}','team','nein')">Nein, externe Hilfe nötig</span>
          </div>
        </div>

        <div class="field">
          <label class="flabel">Mitarbeiter notwendig?</label>
          <div class="yn" id="yn-emp-${n}">
            <span class="yn-btn" onclick="toggleYN(this,'${n}','emp','ja')">Ja</span>
            <span class="yn-btn" onclick="toggleYN(this,'${n}','emp','nein')">Nein</span>
          </div>
          <input class="finput" type="text" placeholder="Falls ja: Anzahl &amp; Rolle?" style="margin-top:5px;" />
        </div>

        <div class="field">
          <label class="flabel">Lager notwendig?</label>
          <div class="yn" id="yn-lager-${n}">
            <span class="yn-btn" onclick="toggleYN(this,'${n}','lager','ja')">Ja</span>
            <span class="yn-btn" onclick="toggleYN(this,'${n}','lager','nein')">Nein</span>
          </div>
        </div>

        <div class="field">
          <label class="flabel">Fahrzeuge notwendig?</label>
          <div class="yn" id="yn-fahr-${n}">
            <span class="yn-btn" onclick="toggleYN(this,'${n}','fahr','ja')">Ja</span>
            <span class="yn-btn" onclick="toggleYN(this,'${n}','fahr','nein')">Nein</span>
          </div>
          <input class="finput" type="text" placeholder="Falls ja: Anzahl &amp; Art?" style="margin-top:5px;" />
        </div>

        <!-- 6. NÄCHSTE SCHRITTE & MVP -->
        <div class="sec">Umsetzung &amp; MVP</div>

        <div class="mvp-box">
          <div class="field">
            <label class="flabel">Minimum Viable Product (MVP) — Kleinste testbare Version</label>
            <textarea class="ftextarea sm" placeholder="Was ist die einfachste Version, mit der wir die Idee testen können — ohne viel Geld auszugeben?"></textarea>
          </div>
          <div class="field" style="margin-top:0.8rem;">
            <label class="flabel">Erster konkreter Schritt (nächste Woche)</label>
            <input class="finput" type="text" placeholder="z.B. 10 potenzielle Kunden anrufen / Prototyp skizzieren …" />
          </div>
        </div>

        <div class="field" style="margin-top:0.8rem;">
          <label class="flabel">Wichtigste Kennzahl zum Messen des Erfolgs (Key Metric)</label>
          <input class="finput" type="text" placeholder="z.B. Anzahl zahlender Kunden / monatlicher Umsatz / Conversion Rate …" />
        </div>

        <div class="field">
          <label class="flabel">Offene Fragen &amp; Annahmen</label>
          <textarea class="ftextarea sm" placeholder="Was nehmen wir noch an? Was müssen wir validieren?"></textarea>
        </div>

        <!-- 7. EINSCHÄTZUNG -->
        <div class="sec">Einschätzung</div>

        <div class="field">
          <label class="flabel">Eigenschaften</label>
          <div class="chips">
            ${CHARS.map(t => `<span class="chip" onclick="this.classList.toggle('on')">${t}</span>`).join('')}
          </div>
        </div>

        <div class="field">
          <label class="flabel">Priorität für uns</label>
          <div class="prio-row" id="prio-${n}">
            ${[1,2,3,4,5].map(i => `<span class="pdot" data-p="${i}" onclick="setPrio(${n},${i})">${i}</span>`).join('')}
          </div>
          <div class="prio-legend"><span>Niedrig</span><span>Sehr hoch</span></div>
        </div>

        <div class="field">
          <label class="flabel">Vertrauen in die Idee (1 = unsicher · 5 = sehr zuversichtlich)</label>
          <div class="conf-wrap">
            <input type="range" min="1" max="5" value="3" step="1" oninput="this.nextElementSibling.textContent=this.value" />
            <span class="conf-val">3</span>
          </div>
        </div>

      </div>
    `;

    grid.appendChild(card);
  }

  function removeCard(n) {
    const c = document.getElementById('card-' + n);
    if (c) c.remove();
    if (!document.querySelector('.card')) showEmpty();
  }

  function showEmpty() {
    const grid = document.getElementById('grid');
    const div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML = '<div class="empty-inner">Noch keine Ideen — klick auf "+ Idee hinzufügen".</div>';
    grid.appendChild(div);
  }

  function setBadge(n, val) {
    const b = document.getElementById('badge-' + n);
    if (b) b.textContent = val ? '— ' + val : '';
  }

  function toggleYN(el, n, group, state) {
    const row = el.closest('.yn');
    row.querySelectorAll('.yn-btn').forEach(b => { b.classList.remove('ja'); b.classList.remove('nein'); });
    el.classList.add(state);
  }

  function setPrio(n, p) {
    document.getElementById('prio-' + n).querySelectorAll('.pdot').forEach(d => {
      d.classList.toggle('on', parseInt(d.dataset.p) === p);
    });
  }

  // Init
  document.getElementById('s-date').value = new Date().toISOString().split('T')[0];
  addCard();
  addCard();
</script>
</body>
</html>
